  #       with:
  #         path: ${{ steps.state-dir.outputs.path }}
  #         key: phpunit-replay-${{ github.ref_name }}
  #         restore-keys: |
  #           phpunit-replay-main
  #     - run: vendor/bin/phpunit-replay verify -p
  #     - uses: actions/cache/save@v4
  #       if: always()
  #       with:
  #         path: ${{ steps.state-dir.outputs.path }}
