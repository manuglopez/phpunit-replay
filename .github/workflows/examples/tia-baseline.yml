# EXAMPLE workflow for a project that USES phpunit-replay — this is not a workflow of the
# phpunit-replay package itself, and it does not run in this repository: GitHub Actions only
# auto-discovers workflow files directly under `.github/workflows/*.yml`, not in a nested
# `examples/` directory, so this file is inert here. Copy it into your own project's
# `.github/workflows/tia-baseline.yml` and adjust the PHP version / package manager to taste.
#
# Records (or refreshes) the phpunit-replay baseline whenever main/develop moves forward, then
# publishes it to the shared remote cache so PRs and other developers inherit the work instead
# of re-recording from scratch. See docs/sharing-the-cache.md for the full guide.
name: TIA baseline

on:
  push:
    branches: [main, develop]

concurrency:
  group: tia-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov

      # git backend only: gives this job write access to the dedicated cache repository.
      # Omit this step entirely for the HTTP or shared-folder backends.
      - name: Set up deploy key for the cache repository
        if: ${{ startsWith(vars.PHPUNIT_REPLAY_REMOTE, 'git@') || startsWith(vars.PHPUNIT_REPLAY_REMOTE, 'git+') }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.REPLAY_CACHE_DEPLOY_KEY }}

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # `--allow-ci-baseline` is what lets a CI run publish a branch baseline at all — without
      # it CI never updates the stored baseline (SPEC §12.1). Swap this for
      # `phpunit-replay record --fresh` instead whenever you know the baseline needs a full
      # re-record: after editing composer.lock/phpunit.xml/phpunit-replay.php (structural
      # fingerprint drift forces this anyway, but doing it explicitly avoids the warning), or
      # right after a `prune --remote --squash` rewrote the remote's history.
      - name: Record baseline
        env:
          PHPUNIT_REPLAY_REMOTE: ${{ vars.PHPUNIT_REPLAY_REMOTE }}
          PHPUNIT_REPLAY_REMOTE_TOKEN: ${{ secrets.PHPUNIT_REPLAY_REMOTE_TOKEN }}
        run: vendor/bin/phpunit-replay run --allow-ci-baseline -p

      # `remote_push` for this job should be 'all' (objects + graph/**) — see phpunit-replay.php
      # in docs/sharing-the-cache.md. Developers and PR jobs keep the default 'objects'.
      - name: Publish baseline and objects to the remote
        env:
          PHPUNIT_REPLAY_REMOTE: ${{ vars.PHPUNIT_REPLAY_REMOTE }}
          PHPUNIT_REPLAY_REMOTE_TOKEN: ${{ secrets.PHPUNIT_REPLAY_REMOTE_TOKEN }}
        run: vendor/bin/phpunit-replay push --graph
